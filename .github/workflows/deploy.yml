name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache DAWG binary
        uses: actions/cache@v4
        with:
          path: public/dict/enable1.dawg
          key: dawg-${{ hashFiles('scripts/words/enable1.txt') }}
          restore-keys: dawg-

      - name: Install dependencies
        run: npm ci

      - name: Build dictionary (if not cached)
        run: |
          if [ ! -f public/dict/enable1.dawg ]; then
            echo "Building DAWG dictionary..."
            npm run build:dict 2>/dev/null || echo "No build:dict script yet, skipping"
          else
            echo "Using cached DAWG"
          fi

      - name: Build app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
